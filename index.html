<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Editor Ultimate - LaTeX & Print Support</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<style>
  :root{--primary:#0f3460;--secondary:#16213e;--accent:#e94560;--text:#e0e0e0;--bg:#1a1a2e;--edit:#9b59b6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  #topbar{background:var(--secondary);padding:8px 16px;display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--primary);z-index:10}
  .btn-group{display:flex;gap:6px;background:rgba(0,0,0,0.2);padding:4px;border-radius:8px}
  .btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:0.82rem;font-weight:600;color:#fff}
  .btn-p{background:var(--primary)}.btn-s{background:#1e8449}.btn-print{background:#2980b9}.btn-e{background:#6c3483}.btn-e.active{background:var(--edit)}
  #main{display:flex;flex:1;overflow:hidden}
  .panel{display:flex;flex-direction:column;width:50%;height:100%}
  textarea{flex:1;background:#0d1b2a;color:#a8d8ea;font-family:monospace;padding:16px;border:none;outline:none}
  iframe{flex:1;border:none;background:#fff}
</style>
</head>
<body>
<div id="topbar">
  <div class="btn-group"><button class="btn btn-p" onclick="update()">▶ 更新</button><button class="btn btn-e" id="ebtn" onclick="toggleEdit()">✏️ 直接改字</button></div>
  <div class="btn-group"><button class="btn btn-print" onclick="printIframe()">🖨 瀏覽器列印</button><button class="btn btn-s" onclick="exportPDF()">⬇ html2pdf 匯出</button></div>
</div>
<div id="main">
  <div class="panel"><textarea id="code" oninput="liveUpdate()"></textarea></div>
  <div class="panel"><iframe id="view"></iframe></div>
</div>
<script>
  let editOn = false, timer = null;
  const $ = id => document.getElementById(id);

  function liveUpdate(){ clearTimeout(timer); timer = setTimeout(update, 500); }

  function update(){
    const content = $('code').value;
    const iframe = $('view');
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    const template = `<!DOCTYPE html><html><head><meta charset="utf-8">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
      <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"><\\/script>
      <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})"><\\/script>
      <style>body{margin:20px;font-family:sans-serif;word-wrap:break-word;}</style></head>
      <body>\${content}</body></html>`;
    doc.open(); doc.write(template); doc.close();
    if(editOn) setTimeout(applyEdit, 100);
  }

  function applyEdit(){
    const doc = $('view').contentDocument;
    doc.querySelectorAll('h1,h2,h3,p,li,td,span,div').forEach(el => { el.contentEditable = true; el.style.outline = '1px dashed #9b59b6'; });
  }

  function toggleEdit(){ editOn = !editOn; $('ebtn').classList.toggle('active', editOn); update(); }
  function printIframe(){ const f = $('view'); f.contentWindow.focus(); f.contentWindow.print(); }
  function exportPDF(){ html2pdf().from($('view').contentDocument.body).set({ margin:10, filename:'export.pdf', html2canvas:{scale:2} }).save(); }

  window.onload = () => {
    $('code').value = '<h1>數學公式測試</h1>\
<p>這是行內公式：$E=mc^2$</p>\
<p>這是獨立區塊公式：</p>\
$$x = \\\\frac{-b \\\\pm \\\\sqrt{b^2 - 4ac}}{2a}$$';
    update();
  };
</script>
</body>
</html>
