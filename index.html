<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Editor Pro</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=cabinet-grotesk@500,700,800&display=swap" rel="stylesheet">
  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script> -->
  <style>
    :root, [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
      --space-12: 3rem; --space-16: 4rem;
      --color-bg: #f7f6f2; --color-surface: #f9f8f5; --color-surface-2: #fbfbf9;
      --color-surface-offset: #edeae5; --color-border: #d4d1ca; --color-divider: #dcd9d5;
      --color-text: #28251d; --color-text-muted: #68665f; --color-text-faint: #8f8c84;
      --color-text-inverse: #f9f8f4; --color-primary: #01696f; --color-primary-hover: #0c4e54;
      --color-primary-highlight: #cedcd8; --color-error: #a12c7b; --color-warning: #964219;
      --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem;
      --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
      --shadow-md: 0 8px 24px oklch(0.2 0.01 80 / 0.10);
      --shadow-lg: 0 18px 40px oklch(0.2 0.01 80 / 0.12);
      --font-body: 'Satoshi', 'Inter', sans-serif;
      --font-display: 'Cabinet Grotesk', 'Inter', sans-serif;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    [data-theme="dark"] {
      --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
      --color-surface-offset: #22211f; --color-border: #393836; --color-divider: #262523;
      --color-text: #cdccca; --color-text-muted: #a7a5a0; --color-text-faint: #7b7974;
      --color-text-inverse: #2b2a28; --color-primary: #4f98a3; --color-primary-hover: #227f8b;
      --color-primary-highlight: #313b3b; --color-error: #d163a7; --color-warning: #bb653b;
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
      --shadow-md: 0 8px 24px oklch(0 0 0 / 0.3);
      --shadow-lg: 0 18px 40px oklch(0 0 0 / 0.4);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.6;
      color: var(--color-text);
      background:
        radial-gradient(circle at top left, color-mix(in oklab, var(--color-primary) 10%, transparent), transparent 26%),
        var(--color-bg);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid color-mix(in oklab, var(--color-text) 12%, transparent);
      background: color-mix(in oklab, var(--color-surface) 88%, transparent);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: var(--space-3); }
    .logo {
      width: 2.5rem; height: 2.5rem; border-radius: 0.8rem;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--color-primary), color-mix(in oklab, var(--color-primary) 65%, white));
      color: white; box-shadow: var(--shadow-md);
      flex: 0 0 auto;
    }
    .brand h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--text-lg);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }
    .brand p { margin: 0; color: var(--color-text-muted); font-size: var(--text-sm); }
    .top-actions, .toolbar, .editor-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .toolbar {
      padding: var(--space-3) var(--space-5);
      border-bottom: 1px solid color-mix(in oklab, var(--color-text) 10%, transparent);
      background: var(--color-surface-2);
      align-items: center;
      justify-content: space-between;
    }
    .toolbar-group { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
    .btn, .select, .input {
      min-height: 42px;
      border-radius: var(--radius-md);
      border: 1px solid color-mix(in oklab, var(--color-text) 12%, transparent);
      background: var(--color-surface);
      color: var(--color-text);
      padding: 0 var(--space-4);
      transition: transform var(--transition), background var(--transition), border-color var(--transition), box-shadow var(--transition);
    }
    .btn:hover, .select:hover, .input:hover { border-color: color-mix(in oklab, var(--color-primary) 35%, var(--color-border)); }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: var(--color-primary);
      color: var(--color-text-inverse);
      border-color: transparent;
      box-shadow: var(--shadow-sm);
    }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-ghost.active {
      background: var(--color-primary-highlight);
      color: var(--color-primary-hover);
      border-color: color-mix(in oklab, var(--color-primary) 25%, transparent);
    }
    .main {
      display: grid;
      grid-template-columns: minmax(320px, 0.95fr) minmax(320px, 1.25fr);
      gap: var(--space-4);
      padding: var(--space-4);
      min-height: 0;
    }
    .panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
      background: color-mix(in oklab, var(--color-surface) 94%, transparent);
      border: 1px solid color-mix(in oklab, var(--color-text) 10%, transparent);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
      padding: var(--space-4);
      border-bottom: 1px solid var(--color-divider);
      background: color-mix(in oklab, var(--color-surface-2) 92%, transparent);
    }
    .panel-header h2 { margin: 0; font-size: var(--text-lg); font-family: var(--font-display); }
    .panel-header p { margin: 0; color: var(--color-text-muted); font-size: var(--text-sm); }
    .editor-wrap { min-height: 0; display: grid; }
    textarea {
      width: 100%; height: 100%; min-height: 520px; resize: none; border: 0; outline: none;
      background: transparent; color: var(--color-text); padding: var(--space-4);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px; line-height: 1.65; tab-size: 2;
    }
    .helper {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--color-divider);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      display: flex; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap;
    }
    .preview-shell {
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--color-surface-offset);
    }
    .preview-meta {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid color-mix(in oklab, var(--color-text) 8%, transparent);
      display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); flex-wrap: wrap;
      color: var(--color-text-muted); font-size: var(--text-sm);
    }
    .frame-wrap {
      min-height: 0;
      overflow: auto;
      padding: var(--space-4);
      background:
        linear-gradient(180deg, color-mix(in oklab, var(--color-surface-offset) 92%, transparent), var(--color-surface-offset));
    }
    iframe {
      width: 100%;
      min-height: 780px;
      border: 1px solid color-mix(in oklab, var(--color-text) 10%, transparent);
      border-radius: var(--radius-lg);
      background: white;
      box-shadow: var(--shadow-lg);
    }
    .status {
      padding: var(--space-2) var(--space-4);
      border-radius: 999px;
      font-size: var(--text-sm);
      background: color-mix(in oklab, var(--color-primary) 12%, var(--color-surface));
      color: var(--color-primary-hover);
    }
    .status.warn { background: color-mix(in oklab, var(--color-warning) 12%, var(--color-surface)); color: var(--color-warning); }
    .status.error { background: color-mix(in oklab, var(--color-error) 12%, var(--color-surface)); color: var(--color-error); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
    @media (max-width: 1100px) {
      .main { grid-template-columns: 1fr; }
      textarea { min-height: 340px; }
      iframe { min-height: 620px; }
    }
    @media (max-width: 720px) {
      .topbar, .toolbar { padding-inline: var(--space-4); }
      .main { padding: var(--space-3); gap: var(--space-3); }
      .panel-header, .helper, .preview-meta { padding-inline: var(--space-3); }
      .frame-wrap { padding: var(--space-3); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 4h9a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H6z"></path>
            <path d="M8 8h6"></path>
            <path d="M8 12h8"></path>
            <path d="M8 16h5"></path>
          </svg>
        </div>
        <div>
          <h1>HTML Editor Pro</h1>
          <p>貼上 HTML、即時預覽、直接改字、匯出 PDF</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn btn-ghost" id="themeToggle" type="button" aria-label="切換深色模式">深色模式</button>
        <button class="btn" id="loadDemo" type="button">載入示例</button>
        <button class="btn btn-primary" id="exportPdf" type="button">匯出 PDF</button>
      </div>
    </header>

    <section class="toolbar" aria-label="工具列">
      <div class="toolbar-group">
        <button class="btn btn-ghost active" id="livePreviewToggle" type="button">即時預覽：開</button>
        <button class="btn btn-ghost" id="editableToggle" type="button">直接改字：關</button>
        <button class="btn" id="syncBack" type="button">同步回 HTML</button>
        <button class="btn" id="copyHtml" type="button">複製 HTML</button>
      </div>
      <div class="toolbar-group">
        <label class="sr-only" for="pageFormat">紙張尺寸</label>
        <select id="pageFormat" class="select">
          <option value="a4">A4</option>
          <option value="letter">Letter</option>
          <option value="legal">Legal</option>
        </select>
        <label class="sr-only" for="orientation">方向</label>
        <select id="orientation" class="select">
          <option value="portrait">直向</option>
          <option value="landscape">橫向</option>
        </select>
        <label class="sr-only" for="margin">邊界</label>
        <select id="margin" class="select">
          <option value="8">窄邊界</option>
          <option value="12" selected>標準邊界</option>
          <option value="18">寬邊界</option>
        </select>
        <label class="sr-only" for="scale">輸出清晰度</label>
        <select id="scale" class="select">
          <option value="1.5">標準清晰度</option>
          <option value="2" selected>高清晰度</option>
          <option value="3">超高清晰度</option>
        </select>
      </div>
    </section>

    <main class="main">
      <section class="panel" aria-label="HTML 原始碼編輯區">
        <div class="panel-header">
          <div>
            <h2>HTML 原始碼</h2>
            <p>可貼上完整 HTML，或只貼 body 內容。</p>
          </div>
          <div class="editor-actions">
            <button class="btn" id="beautify" type="button">整理格式</button>
            <button class="btn" id="clearAll" type="button">清空</button>
          </div>
        </div>
        <div class="helper">
          <span>支援完整文件、inline CSS、簡單版面。</span>
          <span id="codeStats">0 字元</span>
        </div>
        <div class="editor-wrap">
          <textarea id="htmlInput" spellcheck="false"></textarea>
        </div>
      </section>

      <section class="panel" aria-label="預覽區">
        <div class="panel-header">
          <div>
            <h2>即時預覽</h2>
            <p>可切換直接編輯模式，在畫面上改文字。</p>
          </div>
          <div id="status" class="status">準備就緒</div>
        </div>
        <div class="preview-shell">
          <div class="preview-meta">
            <span id="previewInfo">預覽會使用 iframe 載入你的 HTML。</span>
            <span id="editInfo">目前只讀</span>
          </div>
          <div class="frame-wrap">
            <!-- 這裡加入了 allow-downloads 和 allow-popups 權限 -->
            <iframe id="previewFrame" title="HTML 預覽區" sandbox="allow-scripts allow-modals allow-same-origin allow-downloads allow-popups"></iframe>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const htmlInput = document.getElementById('htmlInput');
    const previewFrame = document.getElementById('previewFrame');
    const statusEl = document.getElementById('status');
    const codeStats = document.getElementById('codeStats');
    const previewInfo = document.getElementById('previewInfo');
    const editInfo = document.getElementById('editInfo');
    const editableToggle = document.getElementById('editableToggle');
    const livePreviewToggle = document.getElementById('livePreviewToggle');
    const themeToggle = document.getElementById('themeToggle');

    let livePreview = true;
    let editableMode = false;
    let renderTimer = null;

    const demoHtml = `<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>課程活動海報</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 32px; color: #1f2937; background: #f3f4f6; }
    .sheet { max-width: 860px; margin: 0 auto; background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 45px rgba(0,0,0,.08); }
    .hero { background: linear-gradient(135deg, #0f766e, #155e75); color: white; padding: 44px 40px; }
    .hero h1 { margin: 0 0 12px; font-size: 38px; }
    .hero p { margin: 0; font-size: 18px; opacity: .92; }
    .content { padding: 34px 40px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 24px; }
    .card { border: 1px solid #d1d5db; border-radius: 14px; padding: 18px; }
    .card h3 { margin-top: 0; color: #0f766e; }
    .cta { margin-top: 28px; padding: 18px 22px; background: #ecfeff; border-radius: 14px; border: 1px solid #a5f3fc; }
    .footer { padding: 20px 40px 36px; color: #4b5563; font-size: 14px; }
    .download-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #0f766e; color: white; text-decoration: none; border-radius: 8px; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } .hero, .content, .footer { padding-inline: 22px; } }
  </style>
</head>
<body>
  <div class="sheet">
    <section class="hero">
      <h1>AI 創意寫作工作坊</h1>
      <p>在 90 分鐘內完成故事構思、人物建立與海報文案。</p>
    </section>
    <section class="content">
      <h2>活動重點</h2>
      <div class="grid">
        <div class="card">
          <h3>適合對象</h3>
          <p>中學生、老師、教育工作者，以及想快速產出教學內容的人。</p>
        </div>
        <div class="card">
          <h3>你會學到</h3>
          <p>Prompt 設計、內容改寫、版面調整，以及如何把結果輸出成 PDF。</p>
        </div>
      </div>
      <div class="cta">
        <strong>日期：</strong> 2026 年 5 月 18 日<br>
        <strong>時間：</strong> 下午 3:00 - 4:30<br>
        <strong>地點：</strong> 香港九龍灣創意學習中心<br>
        <!-- 這裡加入一個測試下載的按鈕 -->
        <a href="data:text/plain;charset=utf-8,這是一個測試下載的檔案內容。" download="test.txt" class="download-btn">測試下載功能</a>
      </div>
    </section>
    <div class="footer">可直接點擊標題或段落修改文字，再同步回 HTML。</div>
  </div>
</body>
</html>`;

    function setStatus(message, type = 'normal') {
      statusEl.textContent = message;
      statusEl.className = 'status' + (type === 'warn' ? ' warn' : type === 'error' ? ' error' : '');
    }

    function updateStats() {
      codeStats.textContent = `${htmlInput.value.length.toLocaleString('zh-Hant-HK')} 字元`;
    }

    function normalizeHtml(input) {
      const trimmed = input.trim();
      if (!trimmed) return demoHtml;
      if (/<!doctype|<html[\s>]/i.test(trimmed)) return trimmed;
      return `<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Preview</title></head><body>${trimmed}</body></html>`;
    }

    function injectEditorBridge(html) {
      const bridge = `
<style>
  [data-live-editable="true"] { outline: 2px dashed rgba(1, 105, 111, .18); outline-offset: 2px; cursor: text; }
  [data-live-editable="true"]:focus { outline: 2px solid rgba(1, 105, 111, .55); }
</style>
<script>
(function(){
  function markEditable(enabled){
    if (enabled) {
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
      const elements = new Set();
      let node;
      
      while (node = walker.nextNode()) {
        if (node.nodeValue.trim() !== '') {
          elements.add(node.parentElement);
        }
      }
      
      elements.forEach(el => {
        if (el && !el.closest('script, style, svg, iframe, noscript')) {
          el.setAttribute('contenteditable', 'true');
          el.setAttribute('data-live-editable', 'true');
        }
      });
    } else {
      document.querySelectorAll('[data-live-editable]').forEach(el => {
        el.removeAttribute('contenteditable');
        el.removeAttribute('data-live-editable');
      });
    }
  }
  window.enableLiveTextEdit = function(enabled){ markEditable(!!enabled); };
  window.getEditedHtml = function(){ return '<!DOCTYPE html>\\n' + document.documentElement.outerHTML; };
  window.addEventListener('message', (event) => {
    if (!event.data || !event.data.type) return;
    if (event.data.type === 'SET_EDITABLE') markEditable(event.data.value);
  });
})();
<\/script>`;

      if (/<\/body>/i.test(html)) return html.replace(/<\/body>/i, `${bridge}</body>`);
      return html + bridge;
    }

    function renderPreview() {
      try {
        const finalHtml = injectEditorBridge(normalizeHtml(htmlInput.value));
        previewFrame.srcdoc = finalHtml;
        previewInfo.textContent = '預覽已更新，可用於直接編輯與 PDF 匯出。';
        setStatus('預覽已更新');
      } catch (error) {
        setStatus('HTML 渲染失敗', 'error');
        previewInfo.textContent = error.message;
      }
    }

    function scheduleRender() {
      updateStats();
      if (!livePreview) return;
      if (editableMode) return;
      window.clearTimeout(renderTimer);
      renderTimer = window.setTimeout(renderPreview, 260);
    }

    function setEditableMode(enabled) {
      editableMode = enabled;
      editableToggle.textContent = `直接改字：${enabled ? '開' : '關'}`;
      editableToggle.classList.toggle('active', enabled);
      editInfo.textContent = enabled ? '目前可直接點擊文字修改' : '目前只讀';
      
      const doPost = () => {
        try {
          previewFrame.contentWindow.postMessage({ type: 'SET_EDITABLE', value: enabled }, '*');
        } catch (e) {
          console.error("無法發送訊息至 iframe:", e);
        }
      };
      
      try {
        if (previewFrame.contentDocument?.readyState === 'complete') {
          doPost();
        } else {
          previewFrame.addEventListener('load', doPost, { once: true });
        }
      } catch (e) {
        console.error("無法存取 iframe 內容:", e);
      }
      
      setStatus(enabled ? '已啟用直接改字模式' : '已關閉直接改字模式');
    }

    async function syncBackFromPreview() {
      try {
        const win = previewFrame.contentWindow;
        if (!win || typeof win.getEditedHtml !== 'function') throw new Error('目前預覽未就緒');
        htmlInput.value = win.getEditedHtml();
        updateStats();
        setStatus('已同步修改內容回 HTML');
      } catch (error) {
        setStatus('同步失敗', 'error');
        console.error(error);
      }
    }

    function simpleBeautify(html) {
      return html
        .replace(/></g, '>\n<')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    function exportPdf() {
        try {
          const srcDoc = previewFrame.srcdoc;
          if (!srcDoc) { setStatus('預覽尚未載入完成', 'warn'); return; }

          const format = document.getElementById('pageFormat').value;
          const orientation = document.getElementById('orientation').value;
          const margin = document.getElementById('margin').value;

          // 換算 margin（mm）
          const marginMap = { '8': '8mm', '12': '12mm', '18': '18mm' };
          const marginVal = marginMap[margin] || '12mm';

          // 紙張尺寸對應
          const formatMap = { 'a4': 'A4', 'letter': 'letter', 'legal': 'legal' };
          const paperSize = formatMap[format] || 'A4';

          // 注入列印用 CSS，覆蓋原有 @media print，並自動觸發列印對話框
          const printStyle = `
<style id="__print_override__">
  @media print {
    @page {
      size: ${paperSize} ${orientation === 'landscape' ? 'landscape' : 'portrait'};
      margin: ${marginVal};
    }
    body {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
  }
</style>`;

          // 把列印 CSS 和自動列印腳本注入到 srcdoc 的 </head> 前
          const printScript = `<script>
      window.addEventListener('load', function() {
        window.print();
      });
    <\/script>`;

          let printHtml = srcDoc;

          // 移除之前 injectEditorBridge 注入的橋接腳本和樣式（避免干擾）
          printHtml = printHtml.replace(/<style id="__print_override__">[\s\S]*?<\/style>/g, '');

          // 注入列印樣式到 </head> 前
          if (/<\/head>/i.test(printHtml)) {
            printHtml = printHtml.replace(/<\/head>/i, `${printStyle}</head>`);
          } else {
            printHtml = printStyle + printHtml;
          }

          // 注入自動列印腳本到 </body> 前
          if (/<\/body>/i.test(printHtml)) {
            printHtml = printHtml.replace(/<\/body>/i, `${printScript}</body>`);
          } else {
            printHtml += printScript;
          }

          // 開新分頁並寫入 HTML
          const printTab = window.open('', '_blank');
          if (!printTab) {
            setStatus('請允許彈出視窗以使用列印功能', 'warn');
            return;
          }
          printTab.document.open();
          printTab.document.write(printHtml);
          printTab.document.close();

          setStatus('已開啟列印視窗');
        } catch (error) {
          setStatus('開啟列印失敗', 'error');
          console.error(error);
        }
      }

    document.getElementById('loadDemo').addEventListener('click', () => {
      htmlInput.value = demoHtml;
      updateStats();
      renderPreview();
    });

    document.getElementById('beautify').addEventListener('click', () => {
      htmlInput.value = simpleBeautify(htmlInput.value);
      updateStats();
      renderPreview();
      setStatus('已整理 HTML 格式');
    });

    document.getElementById('clearAll').addEventListener('click', () => {
      htmlInput.value = '';
      updateStats();
      renderPreview();
      setStatus('已清空，並重載預設示例', 'warn');
    });

    document.getElementById('syncBack').addEventListener('click', syncBackFromPreview);
    document.getElementById('copyHtml').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(htmlInput.value);
        setStatus('HTML 已複製到剪貼簿');
      } catch (error) {
        setStatus('複製失敗', 'error');
      }
    });

    editableToggle.addEventListener('click', () => setEditableMode(!editableMode));
    livePreviewToggle.addEventListener('click', () => {
      livePreview = !livePreview;
      livePreviewToggle.textContent = `即時預覽：${livePreview ? '開' : '關'}`;
      livePreviewToggle.classList.toggle('active', livePreview);
      setStatus(livePreview ? '已啟用即時預覽' : '已關閉即時預覽');
      if (livePreview) renderPreview();
    });

    themeToggle.addEventListener('click', () => {
      const root = document.documentElement;
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      themeToggle.textContent = next === 'dark' ? '淺色模式' : '深色模式';
    });

    document.getElementById('exportPdf').addEventListener('click', exportPdf);
    htmlInput.addEventListener('input', scheduleRender);

    previewFrame.addEventListener('load', () => {
      if (editableMode) setEditableMode(true);
    });

    htmlInput.value = demoHtml;
    updateStats();
    renderPreview();
  </script>
</body>
</html>
