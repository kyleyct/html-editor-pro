<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Editor Pro - LaTeX & Print</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<style>
  :root { --p:#0f3460; --s:#16213e; --a:#e94560; --t:#e0e0e0; --bg:#1a1a2e; --e:#9b59b6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--t); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #nav { background: var(--s); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--p); z-index: 100; }
  .logo { font-weight: bold; color: var(--a); font-size: 1.2rem; }
  .btns { display: flex; gap: 8px; }
  button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: #fff; transition: 0.2s; }
  .btn-update { background: var(--p); } .btn-edit { background: #6c3483; } .btn-edit.active { background: var(--e); box-shadow: 0 0 8px var(--e); }
  .btn-print { background: #2980b9; } .btn-pdf { background: #1e8449; }
  #main { display: flex; flex: 1; overflow: hidden; background: #fff; }
  #editor { width: 50%; height: 100%; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
  #code { flex: 1; background: #0d1b2a; color: #a8d8ea; font-family: monospace; font-size: 0.95rem; padding: 20px; border: none; outline: none; resize: none; }
  #preview { flex: 1; height: 100%; position: relative; }
  iframe { width: 100%; height: 100%; border: none; background: #fff; }
  #footer { background: var(--p); padding: 4px 20px; font-size: 0.75rem; color: #7fb3d3; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div id="nav">
  <div class="logo">Editor Pro</div>
  <div class="btns">
    <button class="btn-update" onclick="forceUpdate()">▶ 更新預覽</button>
    <button class="btn-edit" id="eb" onclick="toggleEdit()">✏️ 直接改字</button>
    <button class="btn-print" onclick="doPrint()">🖨 瀏覽器列印</button>
    <button class="btn-pdf" onclick="doPDF()">⬇ PDF 匯出</button>
  </div>
</div>
<div id="main">
  <div id="editor"><textarea id="code" oninput="autoUpdate()" spellcheck="false"></textarea></div>
  <div id="preview"><iframe id="viewer"></iframe></div>
</div>
<div id="footer"><span id="msg">就緒</span><span id="time"></span></div>
<script>
  let isEditing = false, timer = null;
  const el = id => document.getElementById(id);

  function setMsg(m) { el('msg').innerText = m; el('time').innerText = new Date().toLocaleTimeString(); }

  function autoUpdate() { clearTimeout(timer); timer = setTimeout(forceUpdate, 600); }

  function forceUpdate() {
    const raw = el('code').value;
    const frame = el('viewer');
    
    // 解決空白問題：直接使用 iframe.srcdoc 並進行字串處理
    // 不再依賴 document.write 避免生命週期衝突
    const header = '<!DOCTYPE html><html><head><meta charset="utf-8">' +
      '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">' +
      '<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"><\\/script>' +
      '<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters:[{left:\'$$\',right:\'$$\',display:true},{left:\'$\',right:\'$\',display:false}]})"><\\/script>' +
      '<style>body{margin:30px;font-family:sans-serif;line-height:1.6;} @media print{body{margin:0;}}</style></head><body>';
    const footer = '</body></html>';

    frame.srcdoc = header + raw + footer;

    frame.onload = () => {
      if(isEditing) applyEditNodes();
      setMsg('預覽已更新 (LaTeX 支援中)');
    };
  }

  function applyEditNodes() {
    try {
      const d = el('viewer').contentDocument;
      if(!d) return;
      const selectors = 'h1,h2,h3,h4,h5,p,li,span,div,td,th,b,i';
      d.querySelectorAll(selectors).forEach(n => {
        n.contentEditable = true;
        n.style.outline = '1px dashed #9b59b6';
      });
    } catch(e) {}
  }

  function toggleEdit() {
    isEditing = !isEditing;
    el('eb').classList.toggle('active', isEditing);
    forceUpdate();
  }

  function doPrint() { const w = el('viewer').contentWindow; w.focus(); w.print(); }

  function doPDF() {
    const body = el('viewer').contentDocument.body;
    setMsg('正在產生 PDF...');
    html2pdf().from(body).set({ margin:10, filename:'export.pdf', html2canvas:{scale:2} }).save().then(()=>setMsg('匯出完成'));
  }

  window.onload = () => {
    el('code').value = '<h1>數學公式測試</h1>\
<p>這是行內公式：$E=mc^2$</p>\
<p>這是獨立區塊公式：</p>\
$$x = \\\\frac{-b \\\\pm \\\\sqrt{b^2 - 4ac}}{2a}$$';
    setTimeout(forceUpdate, 500);
  };
</script>
</body>
</html>
